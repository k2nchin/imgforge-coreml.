name: ImgForge

options:
  bundleIdPrefix: com.aparataje
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  ImgForge:
    type: application
    platform: iOS
    sources:
      - path: ImgForge
        excludes:
          - "Resources/RealESRGAN.mlmodelc"
      # El modelo lo deposita el workflow; se copia tal cual, ya compilado.
      - path: ImgForge/Resources/RealESRGAN.mlmodelc
        type: folder
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aparataje.imgforge
        INFOPLIST_FILE: ImgForge/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: ImgForgeShare
        embed: true

  ImgForgeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ImgForgeShare
      - path: ImgForge/Engine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aparataje.imgforge.share
        INFOPLIST_FILE: ImgForgeShare/Info.plist

  ImgForgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ImgForgeTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aparataje.imgforge.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ImgForge

schemes:
  ImgForge:
    build:
      targets:
        ImgForge: all
        ImgForgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ImgForgeTests
    archive:
      config: Release
