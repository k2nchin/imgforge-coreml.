name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Configuración de build"
        type: choice
        default: Release
        options: [Release, Debug]
      include_model:
        description: "Incluir RealESRGAN.mlmodelc si existe el artifact"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "ImgForge/**"
      - "ImgForgeShare/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          echo "SDKs:"
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Incorporar el modelo Core ML
        if: ${{ github.event.inputs.include_model == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN=$(gh run list \
            --workflow "Convert Real-ESRGAN to Core ML" \
            --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')

          if [ -z "$RUN" ] || [ "$RUN" = "null" ]; then
            echo "::error::No hay ningún run exitoso de conversión. Corre ese workflow primero."
            exit 1
          fi
          echo "Tomando el modelo del run $RUN"

          gh run download "$RUN" -D model
          find model -name '*.zip' -exec unzip -qo {} -d model \;

          MODEL=$(find model -maxdepth 3 -name 'RealESRGAN.mlmodelc' -type d | head -1)
          if [ -z "$MODEL" ]; then
            echo "::error::El artifact no contiene RealESRGAN.mlmodelc"
            find model -maxdepth 3 | head -20
            exit 1
          fi

          rm -rf ImgForge/Resources/RealESRGAN.mlmodelc
          cp -R "$MODEL" ImgForge/Resources/
          du -sh ImgForge/Resources/RealESRGAN.mlmodelc

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          ls -d ImgForge.xcodeproj

      - name: Tests unitarios
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable)] | .[0].udid // empty')

          if [ -z "$UDID" ]; then
            echo "::error::No hay simulador iOS disponible en el runner."
            xcrun simctl list devices available | head -20
            exit 1
          fi
          echo "Simulador: $UDID"

          xcodebuild test \
            -project ImgForge.xcodeproj \
            -scheme ImgForge \
            -destination "platform=iOS Simulator,id=$UDID" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | xcpretty || {
              echo "::group::Fallos"
              grep -E "error:|failed" test.log | head -40
              echo "::endgroup::"
              exit 1
            }

      - name: Build archive
        env:
          CONFIG: ${{ github.event.inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ImgForge.xcodeproj \
            -scheme ImgForge \
            -configuration "$CONFIG" \
            -destination 'generic/platform=iOS' \
            -archivePath build/ImgForge.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            | tee build.log | xcpretty || {
              echo "::group::Errores"
              grep -E "error:|warning: .*deprecated" build.log | head -60
              echo "::endgroup::"
              exit 1
            }

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/ImgForge.xcarchive/Products/Applications/ImgForge.app"
          test -d "$APP" || { echo "No se generó el .app" >&2; exit 1; }

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/

          cd build
          zip -qry ImgForge-unsigned.ipa Payload
          cd ..

          echo "Tamaño:"
          ls -lh build/ImgForge-unsigned.ipa
          echo "Contenido del bundle:"
          ls build/Payload/ImgForge.app | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ImgForge-unsigned-ipa
          path: build/ImgForge-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Publicar Release con la IPA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}"
          SIZE=$(du -h build/ImgForge-unsigned.ipa | cut -f1)
          MODEL="sin modelo neural"
          [ -d ImgForge/Resources/RealESRGAN.mlmodelc ] && MODEL="con Real-ESRGAN incluido"

          gh release create "$TAG" \
            build/ImgForge-unsigned.ipa \
            --title "ImgForge build ${{ github.run_number }}" \
            --notes "IPA sin firmar, $SIZE, $MODEL.

          Commit: ${{ github.sha }}

          Para instalar hace falta refirmarla con Sideloadly o AltStore usando tu Apple ID." \
            --latest

          echo "Release publicada:"
          gh release view "$TAG" --json url --jq '.url'

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            test.log
          retention-days: 7
          if-no-files-found: ignore
